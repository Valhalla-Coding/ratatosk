[project]
name = "ratatosk"
version = "0.1.0"
description = "GPU traffic control for Idun: one queue for text and images."
requires-python = ">=3.11"
license = "MIT"
dependencies = ["aiohttp>=3.10"]

[project.optional-dependencies]
dev = ["pytest", "pytest-aiohttp"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ratatosk"]

[tool.setuptools.package-data]
ratatosk = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
