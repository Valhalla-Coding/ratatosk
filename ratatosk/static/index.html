<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ratatosk</title>
<style>
  :root { --bg:#14161b; --panel:#1d2027; --line:#2c313b; --text:#e6e8ec; --dim:#8d94a3; --accent:#e8a23c; --good:#5cc08a; --bad:#e0645c; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui, sans-serif; }
  header { display:flex; align-items:center; gap:1rem; padding:.8rem 1rem; border-bottom:1px solid var(--line); }
  h1 { margin:0; font-size:1.2rem; color:var(--accent); }
  nav button { background:none; border:0; color:var(--dim); font:inherit; padding:.4rem .8rem; cursor:pointer; border-bottom:2px solid transparent; }
  nav button.on { color:var(--text); border-color:var(--accent); }
  main { max-width:900px; margin:0 auto; padding:1rem; }
  section { display:none; } section.on { display:block; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:.9rem 1rem; margin-bottom:1rem; }
  .card h2 { margin:0 0 .5rem; font-size:.8rem; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); }
  .bar { height:12px; background:var(--line); border-radius:6px; overflow:hidden; } .bar i { display:block; height:100%; background:var(--accent); }
  table { width:100%; border-collapse:collapse; } th, td { text-align:left; padding:.3rem .4rem; border-bottom:1px solid var(--line); font-size:.9rem; } th { color:var(--dim); font-weight:500; }
  label { display:block; margin:.5rem 0 .15rem; color:var(--dim); font-size:.85rem; }
  input, select, textarea { background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:5px; padding:.35rem .5rem; font:inherit; width:100%; }
  textarea { font-family:ui-monospace, monospace; min-height:4.5rem; }
  .row { display:flex; gap:.5rem; margin-bottom:.4rem; } .row > * { flex:1; } .row button { flex:0 0 auto; }
  button.act { background:var(--accent); color:#1b1306; border:0; border-radius:5px; padding:.45rem 1rem; font:inherit; cursor:pointer; }
  button.small { background:var(--line); color:var(--text); border:0; border-radius:5px; padding:.3rem .6rem; cursor:pointer; }
  .scroll { overflow-x:auto; }
  td, th { font-variant-numeric: tabular-nums; }
  tr.req { cursor:pointer; } tr.req:hover, tr.req.open { background:rgba(255,255,255,.04); } .nowrap { white-space:nowrap; }
  button.chev { background:none; border:0; color:var(--dim); padding:.35rem; min-width:32px; min-height:32px; cursor:pointer; border-radius:5px; line-height:0; }
  button.chev svg { transition:none; } button.chev[aria-expanded="true"] svg { transform:rotate(90deg); } button.chev[aria-expanded="true"] { color:var(--accent); }
  button:focus-visible, summary:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  tr.detail > td { background:var(--bg); padding:.8rem 1rem; }
  .facts { display:grid; grid-template-columns:repeat(auto-fit, minmax(17rem, 1fr)); gap:1rem; margin-bottom:.6rem; }
  .facts h3 { margin:0 0 .3rem; font-size:.75rem; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); }
  dl { margin:0; display:grid; grid-template-columns:auto 1fr; gap:.15rem .8rem; } dt { color:var(--dim); } dd { margin:0; overflow-wrap:anywhere; }
  details.text { margin-top:.5rem; } details.text summary { cursor:pointer; color:var(--text); padding:.25rem 0; }
  pre { margin:.3rem 0 0; padding:.6rem .7rem; background:var(--panel); border:1px solid var(--line); border-radius:5px; max-height:20rem; overflow:auto;
        white-space:pre-wrap; overflow-wrap:anywhere; font:.85rem/1.5 ui-monospace, monospace; }
  .st-ok { color:var(--good); } .st-error, .st-unsupported { color:var(--bad); } .st-cancelled { color:var(--dim); }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  #msg { margin-left:.8rem; } .ok { color:var(--good); } .err { color:var(--bad); } .dim { color:var(--dim); }
</style>
</head>
<body>
<header>
  <h1>🐿️ Ratatosk</h1>
  <nav><button id="tab-now" class="on" onclick="show('now')">Now</button><button id="tab-settings" onclick="show('settings')">Settings</button></nav>
</header>
<main>
  <section id="now" class="on">
    <div class="card"><h2>GPU memory</h2><div class="bar"><i id="gpu-bar" style="width:0"></i></div><div id="gpu-text" class="dim"></div>
      <div id="gpu-who"></div></div>
    <div class="card"><h2>Ratatosk's engine</h2><div id="engine"></div><div id="engine-note" class="st-error"></div></div>
    <div class="card"><h2>Queue</h2><div id="queue"></div><div id="comfy" class="dim"></div></div>
    <div class="card"><h2>Recent requests</h2>
      <div class="scroll"><table><thead><tr><th><span class="sr">Details</span></th><th>When</th><th>Route</th><th>Model</th><th>Context</th><th>In</th><th>Out</th><th>Seconds</th><th>tok/s</th><th>Status</th></tr></thead><tbody id="recent"></tbody></table></div>
      <div class="dim" id="recent-note"></div></div>
  </section>
  <section id="settings">
    <div class="card"><h2>Routes (listening port to backend)</h2><div id="routes"></div><button class="small" onclick="addRoute()">+ route</button>
      <div class="dim">Port changes apply after the service restarts.</div></div>
    <div class="card"><h2>General</h2><div id="fields"></div></div>
    <div class="card"><h2>Models and aliases</h2><label>Model folders (JSON list of {"path", "label"})</label><textarea id="model_folders"></textarea>
      <label>Aliases (JSON, name the client asks for → model id)</label><textarea id="aliases"></textarea>
      <label>Vision files (JSON, model id → path of its mmproj file; only for a model with none beside it)</label><textarea id="mmproj_files"></textarea>
      <label>Request defaults (JSON, model name → fields added when the client leaves them out, e.g. {"chat_template_kwargs": {"enable_thinking": false}})</label><textarea id="request_defaults"></textarea></div>
    <button class="act" onclick="save()">Save</button><span id="msg"></span>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const NUM = ["ui_port","engine_port","max_tokens_cap","max_tokens_cap_plain","idle_minutes","reserve_gb","image_wait_seconds","threads","keep_content","image_max_tokens","reply_reserve"];
const TXT = ["comfy_url","engine_dir","default_model","data_dir"];
let routes = [];

function show(name) {
  for (const s of ["now","settings"]) { $(s).classList.toggle("on", s === name); $("tab-" + s).classList.toggle("on", s === name); }
  if (name === "settings") loadSettings();
}
const CHEVRON = '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const fmt = (v, digits = 1) => v === null || v === undefined ? "-" : Number(v).toFixed(digits);
const localTime = ts => new Date(ts.replace(" ", "T") + "Z").toLocaleString("sv-SE");  // the log stores UTC
let recent = [], recentKey = "", keepContent = 50;
const open = new Set(), details = {};

function drawGpuWho(d) {
  const who = $("gpu-who"), note = $("engine-note");
  who.replaceChildren(); note.textContent = "";
  if (!d.gpu) return;
  const big = (d.gpu.processes || []).filter(p => p.mb >= 100);
  const listed = big.reduce((sum, p) => sum + p.mb, 0), other = d.gpu.used_mb - listed;
  const parts = big.map(p => p.name + " " + p.mb.toLocaleString("sv-SE") + " MB");
  if (other >= 200) parts.push("other " + other.toLocaleString("sv-SE") + " MB");
  who.textContent = parts.length ? "In use by: " + parts.join(" · ") : "Nothing is using the GPU.";
  const foreign = big.filter(p => p.name === "LM Studio engine").reduce((sum, p) => sum + p.mb, 0);
  if (!d.engine && foreign >= 1000) note.textContent = "LM Studio's engine is holding " + foreign.toLocaleString("sv-SE") + " MB, so a model started here would not fit.";
}

function cell(tr, text, cls) { const c = document.createElement("td"); c.textContent = text; if (cls) c.className = cls; tr.appendChild(c); return c; }

function setRecent(rows) {
  const key = JSON.stringify(rows.map(r => [r.id, r.status, r.has_content]));
  if (key === recentKey) return;  // nothing new: leave the table alone so text selection and scrolling survive
  recentKey = key; recent = rows; drawRecent();
}

async function toggle(id) {
  if (open.has(id)) open.delete(id);
  else {
    open.add(id);
    if (!details[id]) {
      try { details[id] = await (await fetch("/api/requests/" + id)).json(); } catch (e) { details[id] = { load_error: true }; }
    }
  }
  drawRecent(id);
}

function facts(title, pairs) {
  const box = document.createElement("div"), h = document.createElement("h3"), dl = document.createElement("dl");
  h.textContent = title;
  for (const [k, v] of pairs) { const dt = document.createElement("dt"), dd = document.createElement("dd"); dt.textContent = k; dd.textContent = v; dl.append(dt, dd); }
  box.append(h, dl); return box;
}

function textBlock(title, text, isOpen) {
  const det = document.createElement("details"), sum = document.createElement("summary"), pre = document.createElement("pre");
  det.className = "text"; det.open = isOpen; sum.textContent = title + " (" + text.length.toLocaleString("sv-SE") + " characters)"; pre.textContent = text;
  det.append(sum, pre); return det;
}

function detailView(d, r) {
  const wrap = document.createElement("div");
  if (!d) { wrap.textContent = "Loading..."; return wrap; }
  if (d.load_error) { wrap.textContent = "Could not load the details."; return wrap; }
  const grid = document.createElement("div"); grid.className = "facts";
  grid.append(
    facts("Where it came from", [["Client", d.client || "unknown"], ["Program", d.user_agent || "unknown"], ["Endpoint", d.path || "unknown"],
      ["Route", r.route + " (" + r.profile + ")"], ["Reply", d.stream ? "streamed" : "all at once"]]),
    facts("How it ran", [["Waited before start", fmt(d.queue_seconds) + " s"], ["Total time", fmt(d.seconds) + " s"], ["Context", String(d.ctx)],
      ["Tokens in / out", d.prompt_tokens + " / " + d.gen_tokens], ["Speed", d.tokens_per_second == null ? "-" : fmt(d.tokens_per_second) + " tok/s"],
      ["Reply length", d.max_tokens_asked ? "asked for " + d.max_tokens_asked + ", allowed " + d.max_tokens : "not asked, allowed " + d.max_tokens]]));
  wrap.appendChild(grid);
  if (d.error) { const e = document.createElement("div"); e.className = "st-error"; e.textContent = "Problem: " + d.error; wrap.appendChild(e); }
  if (d.prompt_text || d.reply_text) {
    if (d.prompt_text) wrap.appendChild(textBlock("Prompt", d.prompt_text, false));
    if (d.reply_text) wrap.appendChild(textBlock("Reply", d.reply_text, true));
  } else { const n = document.createElement("div"); n.className = "dim"; n.textContent = "The text is only kept for the newest " + keepContent + " requests."; wrap.appendChild(n); }
  return wrap;
}

function drawRecent(focusId) {
  const keep = focusId ?? document.activeElement?.dataset?.reqId;  // a redraw must not lose the keyboard position
  const body = $("recent"); body.replaceChildren();
  for (const r of recent) {
    const isOpen = open.has(r.id), tr = document.createElement("tr"), first = document.createElement("td"), btn = document.createElement("button");
    tr.className = "req"; tr.onclick = () => toggle(r.id);
    btn.className = "chev"; btn.dataset.reqId = r.id; btn.setAttribute("aria-expanded", String(isOpen)); btn.setAttribute("aria-controls", "detail-" + r.id);
    btn.setAttribute("aria-label", (isOpen ? "Hide" : "Show") + " details of request " + r.id + " from " + (r.client || "an unknown client"));
    btn.innerHTML = CHEVRON; first.appendChild(btn); tr.appendChild(first);
    cell(tr, localTime(r.ts), "nowrap"); cell(tr, r.route + " " + r.profile, "nowrap");
    [r.model, r.ctx, r.prompt_tokens, r.gen_tokens, fmt(r.seconds), fmt(r.tokens_per_second)].forEach(v => cell(tr, v));
    if (isOpen) tr.classList.add("open");
    cell(tr, r.status, "st-" + r.status);
    body.appendChild(tr);
    if (isOpen) { const dr = document.createElement("tr"), c = cell(dr, ""); dr.id = "detail-" + r.id; dr.className = "detail"; c.colSpan = 10; c.appendChild(detailView(details[r.id], r)); body.appendChild(dr); }
  }
  $("recent-note").textContent = recent.length ? "Click a row to see where the request came from and what was said." : "No requests yet.";
  if (keep) document.querySelector('[data-req-id="' + keep + '"]')?.focus();
}

async function refresh() {
  try {
    const d = await (await fetch("/api/status")).json();
    if (d.gpu) { $("gpu-bar").style.width = (100 * d.gpu.used_mb / d.gpu.total_mb) + "%"; $("gpu-text").textContent = d.gpu.used_mb + " / " + d.gpu.total_mb + " MB"; }
    else { $("gpu-bar").style.width = "0"; $("gpu-text").textContent = "no GPU reading"; }
    $("engine").textContent = d.engine ? d.engine.model + " at " + d.engine.ctx + " tokens of context" : "No model loaded here";
    drawGpuWho(d);
    $("queue").textContent = (d.queue.running ? "Running: " + d.queue.running : "Idle") + (d.queue.pending.length ? "   Waiting: " + d.queue.pending.join(", ") : "");
    $("comfy").textContent = d.comfy_pending === null ? "ComfyUI: not reachable" : "ComfyUI jobs: " + d.comfy_pending;
    setRecent(d.recent);
  } catch (e) { $("queue").textContent = "Cannot reach Ratatosk"; }
}

function drawRoutes() {
  const box = $("routes"); box.replaceChildren();
  routes.forEach((r, i) => {
    const row = document.createElement("div"); row.className = "row";
    const port = Object.assign(document.createElement("input"), { type: "number", value: r.port });
    const kind = Object.assign(document.createElement("select"), {}); ["llm","comfy"].forEach(k => kind.add(new Option(k, k, false, k === r.kind)));
    const prof = Object.assign(document.createElement("select"), {}); ["plain","rp"].forEach(k => prof.add(new Option(k, k, false, k === r.profile)));
    port.oninput = () => r.port = +port.value; kind.onchange = () => r.kind = kind.value; prof.onchange = () => r.profile = prof.value;
    const del = Object.assign(document.createElement("button"), { className: "small", textContent: "remove" }); del.onclick = () => { routes.splice(i, 1); drawRoutes(); };
    row.append(port, kind, prof, del); box.appendChild(row);
  });
}
function addRoute() { routes.push({ port: 11436, kind: "llm", profile: "plain" }); drawRoutes(); }

async function loadSettings() {
  const s = await (await fetch("/api/settings")).json();
  routes = s.routes; drawRoutes();
  const box = $("fields"); box.replaceChildren();
  for (const k of [...NUM, ...TXT]) {
    const label = Object.assign(document.createElement("label"), { textContent: k, htmlFor: "f-" + k });
    const input = Object.assign(document.createElement("input"), { id: "f-" + k, type: NUM.includes(k) ? "number" : "text", value: s[k] });
    box.append(label, input);
  }
  $("model_folders").value = JSON.stringify(s.model_folders, null, 2);
  $("aliases").value = JSON.stringify(s.aliases, null, 2);
  $("mmproj_files").value = JSON.stringify(s.mmproj_files, null, 2);
  $("request_defaults").value = JSON.stringify(s.request_defaults, null, 2);
}

async function save() {
  const msg = $("msg"); msg.className = ""; msg.textContent = "";
  try {
    const body = { routes, model_folders: JSON.parse($("model_folders").value), aliases: JSON.parse($("aliases").value), mmproj_files: JSON.parse($("mmproj_files").value), request_defaults: JSON.parse($("request_defaults").value) };
    for (const k of NUM) body[k] = +$("f-" + k).value;
    for (const k of TXT) body[k] = $("f-" + k).value;
    const res = await fetch("/api/settings", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (res.ok) { msg.className = "ok"; msg.textContent = "Saved"; } else { msg.className = "err"; msg.textContent = (await res.json()).error; }
  } catch (e) { msg.className = "err"; msg.textContent = "The JSON boxes must contain valid JSON"; }
}

refresh(); setInterval(refresh, 2000);
</script>
</body>
</html>
